version: '3'

services:
  base:
    image: node:24.13.0-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "echo 'running npm install' && npm i && echo 'building packages' && npm run build -w packages --if-present && echo 'going to sleep' && echo '0' > /exitcode && sleep infinity"
    healthcheck:
      test: ["CMD", "cat", "/exitcode"]
      interval: 15s
      timeout: 5s
      retries: 40
    volumes:
      - .:/app
    profiles:
      - dev

  api:
    image: node:24.13.0-alpine
    depends_on:
      base:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    working_dir: /app/apps/api
    command: npm start
    volumes:
      - .:/app
      - "${STORAGE_LOCAL_DIR:-/dev/null}:/opt/storage"
    environment:
      DATABASE_URL: "postgres://postgres:password@db/app"
      PORT: "8080"
      JWT_SECRET: "secret"
      STORAGE_TYPE: "local"
      STORAGE_LOCAL_DIR: "/opt/storage"
      STORAGE_RESOURCE_BASE_URL: "http://172.17.1.52:8080/resources"
    networks:
      - api
      - db
    profiles:
      - dev

  api-prod:
    image: ghcr.io/sprice237/mi_casa/api
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - apps/api/.env
    networks:
      - api
      - db
    profiles:
      - prod

  service:
    image: node:24.13.0-alpine
    depends_on:
      base:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    working_dir: /app/apps/service
    command: npm start
    volumes:
      - .:/app
    environment:
      DATABASE_URL: "postgres://postgres:password@db/app"
      REDIS_URL: "redis://redis:6379"
    networks:
      - db
      - redis
    profiles:
      - dev

  service-prod:
    image: ghcr.io/sprice237/mi_casa/service
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - apps/service/.env
    networks:
      - db
      - redis
    profiles:
      - prod

  api-relay:
    image: alpine/socat
    command: "TCP-LISTEN:8080,fork,reuseaddr TCP:api:8080"
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      - api
    ports:
      - "${HOST_API_PORT}:8080"
    networks:
      - api
    profiles:
      - dev

  db:
    image: postgres:17.7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "5432"
    environment:
      - "POSTGRES_PASSWORD=password"
      - "POSTGRES_DB=app"
    networks:
      - db
    volumes:
      - db-data:/var/lib/postgresql/data
    profiles:
      - dev
      - prod

  db-relay:
    image: alpine/socat
    command: "TCP-LISTEN:5432,fork,reuseaddr TCP:db:5432"
    restart: unless-stopped
    expose:
      - "5432"
    depends_on:
      - db
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - db
    profiles:
      - dev

  redis:
    image: redis:7.4-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes
    networks:
      - redis
    volumes:
      - redis_data:/data
    profiles:
      - dev
      - prod

  redis-relay:
    image: alpine/socat
    command: "TCP-LISTEN:6379,fork,reuseaddr TCP:redis:6379"
    restart: unless-stopped
    expose:
      - "6379"
    depends_on:
      - redis
    ports:
      - "6379:6379"
    profiles:
      - dev

  durabull:
    image: ghcr.io/durabullhq/durabull:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DURABULL_AUTHLESS: "true"
      DURABULL_ENV_CONNECTIONS: "true"
      DURABULL_REDIS_URL_ENCRYPTION_KEY: "0207d5223113b2b2bf3d41b8d36d20cf2c6636e9843a17ab582a2fa9f30cb8b0"
      DURABULL_REDIS_URL_MAIN: redis://redis:6379
      DURABULL_REDIS_URL_MAIN_ENVIRONMENT: development
      DURABULL_REDIS_URL_DEFAULT: MAIN
      APP_BASE_URL: http://localhost:3000
      VITE_PUBLIC_APP_URL: http://localhost:3000
    networks:
      - redis
    volumes:
      - durabull_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - dev

  cloudflare:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - api
    profiles:
      - prod

networks:
  api:
  db:
  redis:
      
volumes:
  db-data:
  durabull_data:
  redis_data:
