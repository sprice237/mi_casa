version: '3'

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    depends_on:
      - db
      - localstack
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm i && npm run build -w packages --if-present && cd apps/api && npm start"
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.aws:/root/.aws:ro
    ports:
      - "${HOST_API_PORT}:8080"
    environment:
      - "DATABASE_URL=postgres://postgres:password@db/app"
      - "PORT=8080"

  api-auth:
    build:
      context: .
      dockerfile: ./apps/api-auth/Dockerfile.dev
    depends_on:
      - db
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm i && npm run build -w packages --if-present && cd apps/api-auth && npm start"
    volumes:
      - .:/app
      - /app/node_modules
      - ~/.aws:/root/.aws:ro
    ports:
      - "${HOST_API_AUTH_PORT}:8080"
    environment:
      - "DATABASE_URL=postgres://postgres:password@db/app"
      - "PORT=8080"

  db:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      - "POSTGRES_PASSWORD=password"
      - "POSTGRES_DB=app"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      # - SERVICES=s3,sqs,lambda
      - SERVICES=s3
      # Set your Auth Token here for the Pro image (optional for Community)
      # - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN} 
    # volumes:
      # Required for services like Lambda that need Docker features
      # - "/var/run/docker.sock:/var/run/docker.sock" 
      # Optional: for data persistence (Pro only)
      # - "./volume:/var/lib/localstack" 
      
volumes:
  db-data:
