version: '3'

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    depends_on:
      - db
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm i && npm run build -w packages --if-present && cd apps/api && npm start"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "${HOST_API_PORT}:8080"
    environment:
      - "DATABASE_URL=postgres://postgres:password@db/app"

  db:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      - "POSTGRES_PASSWORD=password"
      - "POSTGRES_DB=app"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      
volumes:
  db-data:
