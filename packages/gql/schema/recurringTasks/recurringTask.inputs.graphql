input RecurringTasksFilterInput {
  equipmentId: ID
}

input CreateRecurringTaskInput {
  name: String!
  rule: Json!
  startDate: Date!
  equipmentId: ID
  projectId: ID
}

input UpdateRecurringTaskInput {
  name: String
  rule: Json
  startDate: Date
  equipmentId: NullableIdInput
  projectId: NullableIdInput
  attachmentIds: UpdateIdListInput
  noteIds: UpdateIdListInput
}

input RecurringTaskProjectionsFilterInput {
  startDate: Date!
  endDate: Date
  limit: Int!
  recurringTaskIds: [ID!]
}