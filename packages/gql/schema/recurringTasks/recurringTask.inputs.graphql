input CreateRecurringTaskInput {
  name: String!
  rule: Json!
  startDate: Date!
  equipmentId: ID
}

input UpdateRecurringTaskInput {
  name: String
  rule: Json
  startDate: Date
  equipmentId: NullableIdInput
}

input RecurringTaskProjectionsFilterInput {
  startDate: Date!
  endDate: Date
  limit: Int!
  recurringTaskIds: [ID!]
}